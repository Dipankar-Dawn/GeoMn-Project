<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Access Workspace</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glass: {
                            dark: '#07070a',
                            panel: 'rgba(18, 17, 26, 0.55)',
                            border: 'rgba(255, 255, 255, 0.12)',
                            accent: '#a855f7',
                            glow: '#c084fc'
                        }
                    },
                    animation: {
                        'float-slow': 'float 8s ease-in-out infinite',
                        'float-reverse': 'floatReverse 10s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translate(0, 0) scale(1)' },
                            '50%': { transform: 'translate(30px, -40px) scale(1.1)' }
                        },
                        floatReverse: {
                            '0%, 100%': { transform: 'translate(0, 0) scale(1)' },
                            '50%': { transform: 'translate(-30px, 40px) scale(1.05)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Liquid Glassmorphism Container */
        .liquid-glass-panel {
            background: rgba(18, 17, 26, 0.55);
            backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.7),
                0 0 40px -10px rgba(168, 85, 247, 0.25),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .liquid-glass-panel:hover {
            border-color: rgba(168, 85, 247, 0.3);
            box-shadow: 
                0 35px 70px -15px rgba(0, 0, 0, 0.8),
                0 0 50px -5px rgba(168, 85, 247, 0.35),
                inset 0 1px 2px 0 rgba(255, 255, 255, 0.3);
        }

        /* Input Fields Styling & Hover Animations */
        .glass-input-wrapper {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-input-wrapper:hover {
            transform: translateY(-2px);
        }

        .glass-input-wrapper:hover .input-icon {
            color: #c084fc;
            transform: scale(1.1);
        }

        .glass-input {
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-input:hover {
            border-color: rgba(168, 85, 247, 0.4);
            background: rgba(168, 85, 247, 0.05);
        }

        .glass-input:focus {
            outline: none;
            border-color: rgba(168, 85, 247, 0.8);
            box-shadow: 
                0 0 25px -5px rgba(168, 85, 247, 0.4),
                inset 0 1px 2px 0 rgba(0, 0, 0, 0.4);
            background: rgba(168, 85, 247, 0.08);
        }

        /* Interactive Liquid Button & Shine Effect */
        .btn-liquid {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.3);
        }

        .btn-liquid::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.4) 50%,
                transparent 100%
            );
            transition: left 0.7s ease-in-out;
        }

        .btn-liquid:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 
                0 12px 35px -5px rgba(168, 85, 247, 0.6),
                0 0 20px rgba(99, 102, 241, 0.5);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .btn-liquid:hover::before {
            left: 100%;
        }

        .btn-liquid:active {
            transform: translateY(-1px) scale(0.99);
        }

        /* Floating Background Glow Orbs */
        .bg-glow-1 {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.22) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(80px);
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(80px);
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen bg-[#07070a] text-slate-100 font-sans flex items-center justify-center p-4 relative overflow-hidden selection:bg-purple-500/30 selection:text-purple-200">

    <!-- Ambient Glowing Background Bubbles -->
    <div class="bg-glow-1 -top-20 -left-20 animate-float-slow"></div>
    <div class="bg-glow-2 -bottom-20 -right-20 animate-float-reverse"></div>

    <!-- Login Glass Card -->
    <main class="w-full max-w-md relative z-10">
        <div class="liquid-glass-panel rounded-3xl p-8 sm:p-10 relative overflow-hidden">
            
            <!-- Glow Accent Header Decor -->
            <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-48 h-48 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

            <!-- Card Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-purple-500/10 border border-purple-500/30 text-purple-400 mb-4 shadow-inner shadow-purple-500/20 transition-transform duration-300 hover:scale-110 hover:rotate-6 cursor-pointer">
                    <i data-lucide="shield-check" class="w-7 h-7"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-extrabold tracking-wide bg-gradient-to-r from-white via-slate-200 to-purple-300 bg-clip-text text-transparent">
                    Welcome Back
                </h2>
                <p class="text-xs sm:text-sm text-slate-400 mt-1.5 font-medium">
                    Authenticate to access your account
                </p>
            </div>

            <!-- Form Controls -->
            <div class="space-y-5">
                
                <!-- Username Input -->
                <div class="glass-input-wrapper">
                    <label for="uid" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
                        Username / UID
                    </label>
                    <div class="relative flex items-center">
                        <span class="absolute left-0 pl-4 pointer-events-none text-slate-400 z-10">
                            <i data-lucide="user" class="w-5 h-5 input-icon transition-all duration-300"></i>
                        </span>
                        <input 
                            id="uid" 
                            type="text" 
                            placeholder="Enter Username or UID" 
                            autocomplete="username"
                            class="glass-input w-full pl-11 pr-4 py-3.5 rounded-xl text-sm text-slate-100 placeholder-slate-500 shadow-inner"
                        />
                    </div>
                </div>

                <!-- Password Input -->
                <div class="glass-input-wrapper">
                    <div class="flex items-center justify-between mb-2">
                        <label for="pwd" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
                            Password
                        </label>
                    </div>
                    <div class="relative flex items-center">
                        <span class="absolute left-0 pl-4 pointer-events-none text-slate-400 z-10">
                            <i data-lucide="lock" class="w-5 h-5 input-icon transition-all duration-300"></i>
                        </span>
                        <input 
                            id="pwd" 
                            type="password" 
                            placeholder="••••••••••••" 
                            autocomplete="current-password"
                            class="glass-input w-full pl-11 pr-12 py-3.5 rounded-xl text-sm text-slate-100 placeholder-slate-500 shadow-inner"
                        />
                        <!-- Eye Toggle Button -->
                        <button 
                            type="button" 
                            id="togglePassword" 
                            aria-label="Toggle password visibility"
                            class="absolute right-0 pr-3.5 h-full flex items-center text-slate-400 hover:text-purple-300 transition-colors focus:outline-none z-20 cursor-pointer group"
                        >
                            <i data-lucide="eye" id="eyeIcon" class="w-5 h-5 transition-transform duration-300 group-hover:scale-110"></i>
                        </button>
                    </div>
                </div>

                <!-- Login Button -->
                <button 
                    onclick="doLogin()" 
                    class="btn-liquid w-full py-3.5 rounded-xl text-sm font-bold tracking-wider uppercase text-white border border-white/20 mt-3 flex items-center justify-center gap-2 cursor-pointer group"
                >
                    <span>Login</span>
                    <i data-lucide="arrow-right" class="w-4 h-4 transition-transform group-hover:translate-x-1"></i>
                </button>

                <!-- Dynamic Message Display -->
                <div id="msg" class="text-red-400 text-xs text-center font-medium min-h-[20px] pt-1"></div>

            </div>
        </div>
    </main>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // 1. EDIT YOUR HARDCODED USERNAMES/PASSWORDS HERE
        const USERS = {
            "admin": "admin123",
            "user1": "pass123",
            "sam": "sam@2026"
        };

        function doLogin() {
            const uid = document.getElementById('uid').value.trim();
            const pwd = document.getElementById('pwd').value;
            const msg = document.getElementById('msg');

            if (USERS[uid] && USERS[uid] === pwd) {
                // Save login state so index.html can verify
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('loggedUser', uid);
                // Redirect to your actual website
                window.location.href = '/app';
            } else {
                msg.textContent = 'Invalid UID or password';
            }
        }

        // Allow Enter key to login
        document.addEventListener('keydown', e => { 
            if (e.key === 'Enter') doLogin(); 
        });

        // If already logged in, skip login
        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = '/app';
        }

        // Eye Icon Toggle Functionality
        const togglePasswordBtn = document.getElementById('togglePassword');
        const pwdInput = document.getElementById('pwd');

        togglePasswordBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const isPassword = pwdInput.getAttribute('type') === 'password';
            pwdInput.setAttribute('type', isPassword ? 'text' : 'password');

            // Swap Eye / Eye-Off Icon
            togglePasswordBtn.innerHTML = isPassword 
                ? '<i data-lucide="eye-off" id="eyeIcon" class="w-5 h-5 transition-transform duration-300 group-hover:scale-110"></i>' 
                : '<i data-lucide="eye" id="eyeIcon" class="w-5 h-5 transition-transform duration-300 group-hover:scale-110"></i>';

            lucide.createIcons();
        });
    </script>
</body>
</html>
